# dsh-Almost Full Access — bundle patch（作为 profile bundle 注册时 loader 自动应用；
# 一键安装脚本会把同样的两块内容写入 profile 的 cordis.patch.yml）
#
# 1) permission 预设表覆盖：🛡️ Almost Full Access 档位
#    进入该模式后，输入框工具行上权限模式控件右侧会出现
#    Fast（宽松）/ Safe（严肃审查）分支选择器（由插件 Client 提供）。
#    config 为整体替换，故完整声明全部预设。
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      almost-full-access:
        sandbox: danger-full-access
        approval: never
        name: 🛡️ Almost Full Access
        description: Full file access with lightweight checks — only irreversible actions (deletes, uninstalls, formatting) and changes that affect normal boot or system/drivers require approval; dynamic/indirect commands are reviewed by a subagent before execution.
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# 2) 插件本体挂载（Host 半区；Client 半区由 dsh.client 声明自动发现）
- insert:
    - id: afaccess
      name: dsh-almost-full-access