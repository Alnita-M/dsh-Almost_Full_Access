# dsh-Almost Full Access — bundle patch（作为 profile bundle 注册时 loader 自动应用；
# 一键安装脚本会把同样的两块内容写入 profile 的 cordis.patch.yml）
#
# 1) permission 预设表覆盖：在 workspace-write 与 Full access 之间插入
#    🛡️ almost-full-access 模式（config 为整体替换，故完整声明全部预设）
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      almost-full-access:
        sandbox: danger-full-access
        approval: never
        name: 🛡️ Almost Full Access
        description: Full file access, but every command is first reviewed by a subagent; commands that may affect files outside the workspace, normal boot, or system drivers require explicit approval.
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# 2) 插件本体挂载（Host 半区；Client 半区由 dsh.client 声明自动发现）
- insert:
    - id: afaccess
      name: dsh-almost-full-access
